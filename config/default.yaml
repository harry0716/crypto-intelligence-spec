app:
  timezone: Asia/Taipei
  language: zh-TW

report:
  top_event_count: 10
  deep_analysis_interval_days: 3
  reader_level: beginner
  max_event_age_hours: 72
  max_events_per_source: 2
  minimum_independent_sources: 3
  output_formats:
    - html
    - pdf

providers:
  market:
    primary: coingecko
    secondary: binance
  news:
    enabled: true
  social:
    enabled: true

quality:
  minimum_event_count: 5
  minimum_provider_success_rate: 0.70
  max_single_domain_ratio: 0.50

# Source policy is versioned with the application. Values here override the
# reviewed defaults in source_governance.py without changing collection code.
source_registry:
  www.coindesk.com:
    requires_confirmation: true
  cointelegraph.com:
    requires_confirmation: true
  www.theblock.co:
    requires_confirmation: true
  bitcoinmagazine.com:
    requires_confirmation: true
  coinmarketcap.com:
    requires_confirmation: true

delivery:
  email_enabled: false
  upload_github_artifact: true
