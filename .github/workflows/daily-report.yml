name: Daily Crypto Intelligence Report

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Report date, YYYY-MM-DD"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[pdf]"
      - name: Run report
        env:
          APP_TIMEZONE: Asia/Taipei
          DATABASE_URL: sqlite:///data/crypto_intelligence.db
          REPORT_OUTPUT_DIR: artifacts
          EMAIL_ENABLED: "false"
          DRY_RUN: "true"
        run: |
          if [ -n "${{ github.event.inputs.report_date }}" ]; then
            python -m crypto_intel.cli daily-report --date "${{ github.event.inputs.report_date }}" --dry-run --no-email
          else
            python -m crypto_intel.cli daily-report --dry-run --no-email
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-intelligence-report
          path: artifacts/
          retention-days: 30
      - name: Build GitHub Pages portal
        run: python scripts/build_pages_portal.py
      - name: Publish portal to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
      - uses: actions/configure-pages@v5
        if: github.event.repository.visibility == 'public'
      - uses: actions/upload-pages-artifact@v3
        if: github.event.repository.visibility == 'public'
        with:
          path: public/
      - uses: actions/deploy-pages@v4
        if: github.event.repository.visibility == 'public'
